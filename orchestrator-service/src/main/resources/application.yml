server:
  port: 8080

spring:
  application:
    name: orchestrator-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5435/orchestrator_db
    username: ${DB_USERNAME:orchestrator}
    password: ${DB_PASSWORD:orchestrator}
    # Password is intentionally absent here: VaultEnvironmentPostProcessor injects
    # spring.datasource.password at startup by fetching it from the local Vault dev server
    # (see README > "Secrets management"). No placeholder/default is defined, so if Vault is
    # unreachable the datasource simply fails to connect with a clear error, rather than silently
    # falling back to a hard-coded value.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  payment-service:
    url: http://localhost:8081/api/payments/confirmation
  compliance-service:
    url: http://localhost:8082/api/compliance/screening

outbox:
  relay:
    fixed-delay: 2000
    batch-size: 20
    max-attempts: 10
  reaper:
    fixed-delay: 60000

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{sagaId}] %logger{36} - %msg%n"
  level:
    com.gk3.demo: INFO
