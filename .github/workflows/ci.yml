name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: mvn test
        run: ./mvnw -B test

  e2e:
    name: End-to-end saga tests
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: mvn verify -Pe2e
        run: ./mvnw -B verify -Pe2e -pl e2e-tests -am
